name: Release

# 打 v* 标签即出包：NSIS 安装包 + latest.yml（自动更新靠它），附带便携版。
on:
  push:
    tags: ['v*']
  workflow_dispatch:

jobs:
  windows:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      # NSIS 才支持自动升级；portable 只是方便直接运行
      - name: Package & publish
        run: npx electron-builder --win nsis portable --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/upload-artifact@v4
        with:
          name: coursedesk-windows
          path: |
            release/*.exe
            release/latest.yml
          if-no-files-found: error
